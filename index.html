<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FAL125</title>
<style>
  html,body{margin:0;height:100%;background:#121016;color:#e8e2ea;font:16px/1.5 system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
  a{color:#ff7ab0}
</style>
</head>
<body>
<div id="msg">Loading FAL125&hellip;</div>
<script>
/* Opens the newest game file (fal125_battle_prototype-vNNN.html) in this repository.
   It asks GitHub for the file list and picks the highest version number.
   If that fails, it opens FALLBACK. Update FALLBACK when you bump the version (Claude does this with every version). */
const FALLBACK = 'fal125_battle_prototype-v287.html';
const REPO = 'jtanis2009-design/Fal-125-Project-game';
const go = f => { location.replace(f + location.hash); };
const show = f => { document.getElementById('msg').innerHTML = 'Opening <a href="' + f + '">' + f + '</a>&hellip;'; };
(async () => {
  let file = FALLBACK;
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/contents/', { cache:'no-store' });
    if (r.ok) {
      const best = (await r.json()).map(x => x.name)
        .map(n => ({ n, v: +((n.match(/^fal125_battle_prototype-v(\d+)\.html$/i) || [])[1] || 0) }))
        .filter(x => x.v).sort((a, b) => b.v - a.v)[0];
      if (best) file = best.n;
    }
  } catch (e) {}
  show(file); go(file);
})();
</script>
</body>
</html>
